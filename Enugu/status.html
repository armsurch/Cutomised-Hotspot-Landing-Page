<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Status</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="status-container">
        <h2>Wi-Fi Connection Status</h2>
        <p>Connected as: <strong>$(username)</strong></p>
        <p>IP Address: <strong>$(ip)</strong></p>
        <p>Download: <strong>$(bytes-in-nice)</strong></p>
        <p>Upload: <strong>$(bytes-out-nice)</strong></p>
        <p>Uptime: <strong>$(uptime)</strong></p>
        <a href="logout.html" class="btn">Logout</a>
    </div>
</body>
</html>
